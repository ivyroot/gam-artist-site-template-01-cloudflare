<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="title desc">
 <title id="title">Example Artwork 2</title>
 <desc id="desc">Example Artwork 2, in black serif lettering with an elaborate embossed border on textured paper.</desc>
 <defs>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="14" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="emboss" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
   <feGaussianBlur in="SourceAlpha" stdDeviation="1.25" result="blur"/>
   <feOffset in="blur" dx="2.4" dy="3" result="shade"/>
   <feFlood flood-color="#7d8a6c" flood-opacity=".8"/><feComposite in2="shade" operator="in" result="dark"/>
   <feOffset in="blur" dx="-1.8" dy="-2" result="shine"/>
   <feFlood flood-color="#f3f6e9"/><feComposite in2="shine" operator="in" result="bright"/>
   <feMerge><feMergeNode in="dark"/><feMergeNode in="bright"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="stock"><stop stop-color="#f3f6e9" stop-opacity=".3"/><stop offset="1" stop-color="#7d8a6c" stop-opacity=".15"/></radialGradient>
  <g id="flower"><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(0)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(30)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(60)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(90)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(120)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(150)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(180)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(210)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(240)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(270)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(300)"/><ellipse cx="0" cy="-17" rx="5" ry="17" transform="rotate(330)"/><circle r="8"/><circle r="3"/></g>
 </defs>
 <path fill="#cbd1bd" d="M0 0h600v680H0z"/>
 <path fill="url(#stock)" filter="url(#paper)" d="M0 0h600v680H0z"/>
 <g fill="none" stroke="#9da98c" filter="url(#emboss)">
  <rect x="32" y="32" width="536" height="616" rx="4" stroke-width="3"/>
  <rect x="43" y="43" width="514" height="594" rx="2" stroke-width="1"/>
  <rect x="52" y="52" width="496" height="576" rx="42" stroke-width="2"/>
  <rect x="61" y="61" width="478" height="558" rx="36" stroke-width=".8" stroke-dasharray="1 5"/>
  <g opacity=".23" stroke-width=".65"><ellipse cx="300" cy="340" rx="196" ry="235" transform="rotate(22.5 300 340)"/><ellipse cx="300" cy="340" rx="196" ry="235" transform="rotate(45 300 340)"/><ellipse cx="300" cy="340" rx="196" ry="235" transform="rotate(67.5 300 340)"/><ellipse cx="300" cy="340" rx="196" ry="235" transform="rotate(90 300 340)"/><ellipse cx="300" cy="340" rx="196" ry="235" transform="rotate(112.5 300 340)"/><ellipse cx="300" cy="340" rx="196" ry="235" transform="rotate(135 300 340)"/><ellipse cx="300" cy="340" rx="196" ry="235" transform="rotate(157.5 300 340)"/><ellipse cx="300" cy="340" rx="196" ry="235" transform="rotate(180 300 340)"/></g>
  <use href="#flower" transform="translate(72 72) scale(.72)" stroke-width="1.2"/>
  <use href="#flower" transform="translate(528 72) scale(.72)" stroke-width="1.2"/>
  <use href="#flower" transform="translate(72 608) scale(.72)" stroke-width="1.2"/>
  <use href="#flower" transform="translate(528 608) scale(.72)" stroke-width="1.2"/>
 </g>
 <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#4a4842">
  <text x="300" y="285" font-size="66" letter-spacing="1">Example</text>
  <text x="300" y="365" font-size="68" letter-spacing="1">Artwork</text>
  <text x="300" y="495" font-size="128">2</text>
 </g>
 </svg>
